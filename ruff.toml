line-length = 120
target-version = "py311"

[lint]
# Errors (unused/undefined names, syntax) and import order; style is left as it is.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # long prompt strings are easier to read on one line
    "E741",  # `l` for a language/lemma in short comprehensions
]

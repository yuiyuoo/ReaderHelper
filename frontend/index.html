<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Home-screen app (iPhone: Safari → Share → Add to Home Screen; Android: ⋮ → Add to Home screen) -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ReaderHelper">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f0ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141512" media="(prefers-color-scheme: dark)">
  <title>ReaderHelper</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%232d6a4f'/%3E%3Cpath d='M8 9.5c2-.8 4-.8 6 .5v9c-2-1.3-4-1.3-6-.5v-9zM20 9.5c-2-.8-4-.8-6 .5v9c2-1.3 4-1.3 6-.5v-9z' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600&subset=vietnamese&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="reading">
  <header class="read-bar">
    <div class="read-left">
      <a class="icon-btn" href="/" aria-label="Back to the library" title="Library">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="toc-wrap">
        <button id="tocBtn" class="toc-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tocMenu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="2.5" cy="4" r="1" fill="currentColor"/><circle cx="2.5" cy="8" r="1" fill="currentColor"/><circle cx="2.5" cy="12" r="1" fill="currentColor"/></svg>
          <span id="chapterLabel" class="chapter-label">Opening…</span>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="tocMenu" class="toc-menu" hidden>
          <div id="bookTitle" class="toc-book"></div>
          <nav id="tocList" aria-label="Chapters"></nav>
        </div>
      </div>
    </div>

    <div class="read-right">
      <div class="progress" title="Reading progress">
        <span id="progressPct">–</span>
        <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
      </div>
      <div class="seg" role="group" aria-label="Text size">
        <button id="fontDown" type="button" aria-label="Smaller text" title="Smaller text">A−</button>
        <button id="fontUp" type="button" aria-label="Larger text" title="Larger text">A+</button>
      </div>
      <button id="spreadBtn" class="icon-btn spread-btn" type="button" aria-pressed="false"
              aria-label="Two pages side by side" title="Two pages side by side (like a book)">
        <svg class="i-two" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 5.5C8 4 5.5 3.8 2.5 4.5v11c3-.7 5.5-.5 7.5 1 2-1.5 4.5-1.7 7.5-1v-11c-3-.7-5.5-.5-7.5 1zM10 5.5v11" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
      <button id="aiBtn" class="icon-btn ai-btn" type="button" aria-pressed="true" aria-label="AI meanings">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5l1.6 4.4 4.4 1.6-4.4 1.6L10 14.5l-1.6-4.4L4 8.5l4.4-1.6L10 2.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15.5 13l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z" fill="currentColor"/></svg>
        <span class="ai-label">AI</span>
      </button>
      <button id="markBtn" class="icon-btn mark-btn" type="button" aria-pressed="true"
              aria-label="Highlight saved words" title="Highlight saved words in the text">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 3.5l4 4-7.5 7.5H5v-4l7.5-7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 17.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="seg-wrap">
        <span class="seg-label" id="targetLabel">Meaning</span>
        <div id="targetGroup" class="seg" role="group" aria-labelledby="targetLabel">
          <button type="button" data-lang="vi" title="Meanings in Tiếng Việt">VI</button>
          <button type="button" data-lang="en" title="Meanings in English">EN</button>
          <button type="button" data-lang="de" title="Meanings in Deutsch">DE</button>
        </div>
      </div>
      <button id="autoplay" class="icon-btn" type="button" aria-pressed="false" aria-label="Auto-play pronunciation" title="Auto-play pronunciation">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 8v4h3l4 3.5v-11L6.5 8h-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 7.5a3.5 3.5 0 010 5M15.5 5.5a6.5 6.5 0 010 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
        <svg class="i-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <a class="icon-btn vocab-link" href="/vocab" aria-label="Vocabulary" title="Vocabulary">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5 2.5h8a1 1 0 011 1v12l-5-3-5 3v-12a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span id="vocabCount" class="badge mini" hidden></span>
      </a>
    </div>
  </header>

  <main class="read-stage">
    <button id="prev" class="page-nav" type="button" aria-label="Previous page (←)" title="Previous page (←)" disabled>
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="page-card">
      <div id="viewer"><p class="placeholder">Opening book…</p></div>
    </div>
    <button id="next" class="page-nav" type="button" aria-label="Next page (→)" title="Next page (→)" disabled>
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </main>
  <div id="status" class="read-status" role="status" aria-live="polite" hidden></div>

  <div id="popover" class="popover" hidden role="dialog" aria-live="polite"></div>
  <button id="selBtn" class="sel-btn" hidden title="Translate the selected text">Dịch · Translate</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script src="/static/reader.js"></script>
</body>
</html>

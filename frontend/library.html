<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library · ReaderHelper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%230F6B5C'/%3E%3Cpath d='M8 9.5c2-.8 4-.8 6 .5v9c-2-1.3-4-1.3-6-.5v-9zM20 9.5c-2-.8-4-.8-6 .5v9c2-1.3 4-1.3 6-.5v-9z' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600&subset=vietnamese&display=swap" rel="stylesheet">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <a class="brand-link" href="/">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 9.5c2-.8 4-.8 6 .5v9c-2-1.3-4-1.3-6-.5v-9zM20 9.5c-2-.8-4-.8-6 .5v9c2-1.3 4-1.3 6-.5v-9z" stroke="var(--on-accent)" stroke-width="1.6" stroke-linejoin="round"/></svg>
      ReaderHelper
    </a>
    <span class="spacer"></span>
    <button id="addBtn" class="btn primary" type="button">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Add book
    </button>
    <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <a class="btn" href="/review">Review <span id="dueCount" class="badge" hidden></span></a>
    <a class="btn" href="/vocab">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M5 2.5h8a1 1 0 011 1v12l-5-3-5 3v-12a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Vocabulary <span id="vocabCount" class="badge" hidden></span>
    </a>
    <input id="epubInput" type="file" accept=".epub,application/epub+zip" hidden>
  </header>

  <main class="library">
    <h1>Your library</h1>
    <p class="sub" id="libSub">Pick a book to continue reading.</p>
    <div id="libStatus" class="lib-status" role="status" aria-live="polite"></div>
    <div id="grid" class="book-grid"></div>
    <div id="empty" class="empty-lib" hidden>
      <svg width="64" height="64" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M8 9.5c2-.8 4-.8 6 .5v9c-2-1.3-4-1.3-6-.5v-9zM20 9.5c-2-.8-4-.8-6 .5v9c2-1.3 4-1.3 6-.5v-9z" stroke="var(--accent)" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <h2>No books yet</h2>
      <p>Add an EPUB with <strong>Add book</strong>, drag one onto this page, or put .epub files into the <code>books/</code> folder.</p>
    </div>
  </main>

  <div id="dropHint" class="drop-hint" hidden>Drop the EPUB to add it</div>

  <dialog id="bookDialog" class="book-dialog" aria-labelledby="dlgTitle">
    <form method="dialog" id="bookForm" novalidate>
      <div class="dlg-body">
        <h2 id="dlgTitle">Book details</h2>
        <div class="dlg-cover">
          <div id="dlgCover" class="cover"></div>
          <button type="button" class="link-btn" id="coverPick">Choose picture…</button>
          <input id="coverInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
          <button type="button" class="link-btn" id="coverRemove">Use default icon</button>
        </div>
        <div class="dlg-fields">
          <label class="field">Name shown in the library
            <input id="fTitle" name="title" required maxlength="200" autocomplete="off">
          </label>
          <label class="field"><span>Author <span class="hint">(optional)</span></span>
            <input id="fAuthor" name="author" maxlength="200" autocomplete="off">
          </label>
          <p class="field"><span class="hint" id="fFile"></span></p>
        </div>
        <p id="dlgError" class="dlg-error" role="alert" hidden></p>
      </div>
      <div class="dlg-actions">
        <button type="button" id="deleteBtn" class="danger-btn">Remove book</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" id="saveBtn" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/static/library.js"></script>
</body>
</html>

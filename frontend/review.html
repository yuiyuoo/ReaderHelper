<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Home-screen app (iPhone: Safari → Share → Add to Home Screen; Android: ⋮ → Add to Home screen) -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ReaderHelper">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f0ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141512" media="(prefers-color-scheme: dark)">
  <title>Review · ReaderHelper</title>
  <script src="/static/theme.js"></script>
  <script src="/static/profile.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%232d6a4f'/%3E%3Cpath d='M8 9.5c2-.8 4-.8 6 .5v9c-2-1.3-4-1.3-6-.5v-9zM20 9.5c-2-.8-4-.8-6 .5v9c2-1.3 4-1.3 6-.5v-9z' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600&subset=vietnamese&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <a class="btn" href="/">← Library</a>
    <span class="spacer"></span>
    <label class="check" for="bookFilter">Words from</label>
    <select id="bookFilter"><option value="">All books</option></select>
    <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <a class="btn" href="/vocab">Vocabulary</a>
  </header>

  <main class="review">
    <div class="review-top">
      <h1>Review</h1>
      <span id="counts" class="review-counts"></span>
    </div>
    <div class="progress-track review-progress" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>

    <section id="card" class="flashcard" hidden aria-live="polite">
      <div class="fc-meta"><span id="cLang" class="lang-tag"></span><span id="cBook" class="fc-book"></span></div>
      <div class="fc-word-row">
        <span id="cWord" class="fc-word"></span>
        <button id="speakBtn" class="icon-btn" type="button" aria-label="Pronounce" title="Pronounce">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 8v4h3l4 3.5v-11L6.5 8h-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 7.5a3.5 3.5 0 010 5M15.5 5.5a6.5 6.5 0 010 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="cLemma" class="fc-lemma"></p>
      <p id="cSentence" class="fc-sentence"></p>
      <p class="fc-hint" id="fcHint">Do you remember what it means here?</p>

      <div id="answer" class="fc-answer" hidden>
        <div id="cTranslation" class="fc-translation"></div>
        <div id="cSense" class="fc-sense"></div>
        <div id="cGrammar" class="fc-grammar"></div>
        <p id="cGloss" class="fc-gloss"></p>
        <p id="cSentenceTr" class="fc-sentence-tr"></p>
        <a id="cOpen" class="link-btn" hidden>Open in book →</a>
      </div>

      <div class="fc-actions">
        <button id="showBtn" class="primary fc-show" type="button">Show answer <kbd>Space</kbd></button>
        <div id="grades" class="fc-grades" hidden>
          <button type="button" data-grade="again" class="g-again">Again<small></small></button>
          <button type="button" data-grade="hard" class="g-hard">Hard<small></small></button>
          <button type="button" data-grade="good" class="g-good">Good<small></small></button>
          <button type="button" data-grade="easy" class="g-easy">Easy<small></small></button>
        </div>
      </div>
      <p class="fc-keys">Keys: <kbd>Space</kbd> show answer · <kbd>1</kbd>–<kbd>4</kbd> Again / Hard / Good / Easy</p>
    </section>

    <section id="done" class="review-done" hidden>
      <h2 id="doneTitle">All done for now</h2>
      <p id="doneText"></p>
      <div class="review-done-actions">
        <a class="btn primary" href="/">Back to reading</a>
        <a class="btn" href="/vocab">All saved words</a>
      </div>
    </section>
    <p id="error" class="lib-status error" role="alert" hidden></p>
  </main>

  <script src="/static/review.js"></script>
</body>
</html>

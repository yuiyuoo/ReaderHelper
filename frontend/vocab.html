<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary · ReaderHelper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fb3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;1,400&subset=vietnamese&display=swap" rel="stylesheet">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <strong class="brand">ReaderHelper</strong>
    <a class="btn" href="/">← Library</a>
    <span class="spacer"></span>
    <label class="check" for="bookFilter">Words from</label>
    <select id="bookFilter"><option value="">All books</option></select>
    <a class="btn primary" id="reviewLink" href="/review">Review <span id="dueCount" class="badge" hidden></span></a>
    <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg class="i-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <a class="btn" href="/api/vocab.csv" download>Export CSV (Anki)</a>
  </header>
  <div class="page">
    <h2 id="count">Saved words</h2>
    <table>
      <thead><tr><th>Words</th><th>Notes</th><th>Sentence</th><th>Saved</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>No saved words yet. Click a word while reading and press “Save word”.</div>
  </div>
  <script>
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const rows = document.getElementById("rows");
    let items = [];

    function wordCell(v) {
      const open = v.book_id
        ? `<br><a class="book-link" href="/read?book=${encodeURIComponent(v.book_id)}${v.cfi ? `&cfi=${encodeURIComponent(v.cfi)}` : ""}"
             title="${v.cfi ? "Open the book at this word" : "Open the book (position unknown for this word)"}">${esc(v.book_title || "Book")} →</a>`
        : "";
      return `<strong>${esc(v.word)}</strong> <span class="lang-tag">${esc(v.lang)}</span>` +
        (v.lemma && v.lemma.toLowerCase() !== v.word.toLowerCase() ? `<br><small>${esc(v.lemma)}</small>` : "") + open;
    }

    function viewRow(v) {
      return `<tr data-id="${v.id}">
        <td>${wordCell(v)}</td>
        <td class="notes-cell"><strong>${esc(v.translation_vi)}</strong> <span class="lang-tag" title="Language of the meaning">${esc(v.target_lang || "vi")}</span><br>${esc(v.gloss_vi)}</td>
        <td class="sent">${esc(v.sentence)}</td>
        <td><small>${esc(new Date(v.created_at).toLocaleDateString())}</small></td>
        <td class="row-actions">
          <button data-act="edit">Edit</button>
          <button data-act="delete" title="Delete">Delete</button>
        </td>
      </tr>`;
    }

    function editRow(v) {
      return `<tr data-id="${v.id}" class="editing">
        <td>${wordCell(v)}</td>
        <td class="notes-cell">
          <input name="translation_vi" value="${esc(v.translation_vi)}" placeholder="Tiếng Việt" aria-label="Vietnamese translation">
          <textarea name="gloss_vi" rows="3" placeholder="Giải thích" aria-label="Vietnamese explanation">${esc(v.gloss_vi)}</textarea>
        </td>
        <td><textarea name="sentence" rows="4" aria-label="Sentence">${esc(v.sentence)}</textarea></td>
        <td><small>${esc(new Date(v.created_at).toLocaleDateString())}</small></td>
        <td class="row-actions">
          <button data-act="save" class="primary">Save</button>
          <button data-act="cancel">Cancel</button>
          <div class="row-error error" hidden></div>
        </td>
      </tr>`;
    }

    function render() {
      document.getElementById("count").textContent = `Saved words (${items.length})`;
      document.getElementById("empty").hidden = items.length > 0;
      rows.innerHTML = items.map(viewRow).join("");
    }

    const bookFilter = document.getElementById("bookFilter");
    const bookQuery = () => (bookFilter.value ? `?book_id=${encodeURIComponent(bookFilter.value)}` : "");

    async function loadBooks() {
      try {
        const books = (await (await fetch("/api/books")).json()).filter((b) => b.word_count > 0);
        for (const b of books) bookFilter.add(new Option(`${b.title} (${b.word_count})`, b.id));
        const want = new URLSearchParams(location.search).get("book");
        if (want && books.some((b) => String(b.id) === want)) bookFilter.value = want;
      } catch { /* filter is optional */ }
    }

    async function load() {
      try { items = await (await fetch(`/api/vocab${bookQuery()}`)).json(); }
      catch { rows.innerHTML = `<tr><td colspan="5" class="error">Could not load vocabulary.</td></tr>`; return; }
      render();
      try {
        const c = await (await fetch(`/api/review/counts${bookQuery()}`)).json();
        const n = c.due + c.new;
        document.getElementById("dueCount").textContent = n;
        document.getElementById("dueCount").hidden = n === 0;
        document.getElementById("reviewLink").href = "/review" + (bookFilter.value ? `?book=${bookFilter.value}` : "");
      } catch { /* count is optional */ }
    }

    bookFilter.addEventListener("change", () => {
      const url = new URL(location.href);
      if (bookFilter.value) url.searchParams.set("book", bookFilter.value); else url.searchParams.delete("book");
      history.replaceState(null, "", url);
      load();
    });

    const byId = (id) => items.find((v) => String(v.id) === String(id));

    async function save(tr) {
      const id = tr.dataset.id;
      const body = {};
      tr.querySelectorAll("[name]").forEach((el) => { body[el.name] = el.value; });
      const err = tr.querySelector(".row-error");
      if (!body.sentence.trim()) { err.textContent = "The sentence can't be empty."; err.hidden = false; return; }
      tr.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      try {
        const r = await fetch(`/api/vocab/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Save failed.");
        items[items.indexOf(byId(id))] = data;
        tr.outerHTML = viewRow(data);
      } catch (e) {
        err.textContent = e.message; err.hidden = false;
        tr.querySelectorAll("button").forEach((b) => { b.disabled = false; });
      }
    }

    rows.addEventListener("click", async (e) => {
      const act = e.target.dataset?.act;
      const tr = e.target.closest("tr");
      if (!act || !tr) return;
      const v = byId(tr.dataset.id);
      if (act === "edit") {
        tr.outerHTML = editRow(v);
        rows.querySelector(`tr[data-id="${v.id}"] [name="translation_vi"]`).focus();
      }
      if (act === "cancel") tr.outerHTML = viewRow(v);
      if (act === "save") save(tr);
      if (act === "delete") {
        if (!confirm("Delete this word?")) return;
        const r = await fetch(`/api/vocab/${v.id}`, { method: "DELETE" });
        if (r.ok) { items = items.filter((x) => x !== v); render(); } else alert("Delete failed.");
      }
    });

    // Keyboard: Ctrl/Cmd+Enter saves, Esc cancels while editing.
    rows.addEventListener("keydown", (e) => {
      const tr = e.target.closest("tr.editing");
      if (!tr) return;
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(tr); }
      if (e.key === "Escape") tr.outerHTML = viewRow(byId(tr.dataset.id));
    });

    loadBooks().then(load);
  </script>
</body>
</html>

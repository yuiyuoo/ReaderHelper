name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm
          python -m spacy download de_core_news_sm
      - name: Lint
        run: ruff check backend tests tools
      - name: Test
        run: pytest -q

  docker:
    # Build on every push/PR; publish to GitHub Container Registry only from main.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          load: true   # also keep it locally for the smoke test
          tags: |
            ${{ steps.meta.outputs.tags }}
            readerhelper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name rh -p 8000:8000 readerhelper:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/profiles && exit 0; sleep 2; done
          docker logs rh; exit 1
